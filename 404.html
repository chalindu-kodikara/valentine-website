<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Store the path and redirect to index.html
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;

        // Store the full path in sessionStorage
        sessionStorage.redirect = l.href;

        // Redirect to the base index.html
        var indexPath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';

        l.replace(indexPath);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
